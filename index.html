<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rompecabezas Arrastrable</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }
        
        h1 {
            color: #2c3e50;
            margin: 20px 0;
            text-align: center;
        }
        
        .game-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        
        #puzzle-container {
            width: 400px;
            height: 400px;
            border: 3px solid #2c3e50;
            border-radius: 10px;
            background-color: #ecf0f1;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        #pieces-container {
            width: 400px;
            min-height: 400px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
            padding: 10px;
            border: 2px dashed #7f8c8d;
            border-radius: 10px;
            background-color: rgba(255,255,255,0.5);
        }
        
        .puzzle-piece {
            width: calc(400px / var(--grid-size) - 10px);
            height: calc(400px / var(--grid-size) - 10px);
            background-size: 400px 400px;
            position: relative;
            cursor: grab;
            transition: transform 0.1s;
            border: 2px solid #fff;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
        }
        
        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .puzzle-piece.placed {
            position: absolute;
            cursor: default;
            box-shadow: none;
        }
        
        #controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: 600;
        }
        
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        
        #success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @media (max-width: 900px) {
            .game-area {
                flex-direction: column;
                align-items: center;
            }
            
            #puzzle-container, #pieces-container {
                width: 300px;
                height: 300px;
            }
            
            .puzzle-piece {
                width: calc(300px / var(--grid-size) - 10px);
                height: calc(300px / var(--grid-size) - 10px);
                background-size: 300px 300px;
            }
        }
    </style>
</head>
<body>
    <h1>Rompecabezas Arrastrable</h1>
    
    <div class="game-area">
        <div id="puzzle-container"></div>
        <div id="pieces-container"></div>
    </div>
    
    <div id="controls">
        <button id="start-btn">Nuevo Juego</button>
    </div>
    
    <div id="success-message">¡Rompecabezas Completo!</div>
    
    <script>
        // Configuración del juego
        const GRID_SIZE = 4; // 4x4 piezas
        const IMAGE_URL = 'puzzle.jpg'; // Nombre de tu imagen
        
        // Elementos del DOM
        const puzzleContainer = document.getElementById('puzzle-container');
        const piecesContainer = document.getElementById('pieces-container');
        const startBtn = document.getElementById('start-btn');
        const successMessage = document.getElementById('success-message');
        
        // Variables del juego
        let pieces = [];
        let placedPieces = 0;
        let boardSize = 400;
        let pieceSize = 0;
        
        // Inicializar el juego
        function initGame() {
            // Ajustar tamaño para móviles
            if (window.innerWidth <= 900) {
                boardSize = 300;
            }
            
            puzzleContainer.style.width = boardSize + 'px';
            puzzleContainer.style.height = boardSize + 'px';
            piecesContainer.style.width = boardSize + 'px';
            
            pieceSize = boardSize / GRID_SIZE;
            
            // Cargar la imagen
            loadImage();
            
            // Event listeners
            startBtn.addEventListener('click', initGame);
        }
        
        function loadImage() {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = IMAGE_URL;
            
            img.onload = function() {
                createPuzzlePieces(img);
            };
            
            img.onerror = function() {
                alert('Error al cargar la imagen. Asegúrate de que se llame "puzzle.jpg" y esté en la misma carpeta.');
            };
        }
        
        function createPuzzlePieces(img) {
            // Limpiar contenedores
            puzzleContainer.innerHTML = '';
            piecesContainer.innerHTML = '';
            pieces = [];
            placedPieces = 0;
            successMessage.style.display = 'none';
            
            // Crear canvas temporal
            const canvas = document.createElement('canvas');
            canvas.width = boardSize;
            canvas.height = boardSize;
            const ctx = canvas.getContext('2d');
            
            // Dibujar imagen ajustada
            const imgRatio = img.width / img.height;
            const containerRatio = boardSize / boardSize;
            
            let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
            
            if (imgRatio > containerRatio) {
                drawHeight = boardSize;
                drawWidth = img.width * (boardSize / img.height);
                offsetX = (boardSize - drawWidth) / 2;
            } else {
                drawWidth = boardSize;
                drawHeight = img.height * (boardSize / img.width);
                offsetY = (boardSize - drawHeight) / 2;
            }
            
            ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
            
            // Crear piezas
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece';
                    piece.style.setProperty('--grid-size', GRID_SIZE);
                    
                    // Posición original
                    piece.dataset.row = row;
                    piece.dataset.col = col;
                    
                    // Coordenadas del background
                    const bgX = -col * pieceSize;
                    const bgY = -row * pieceSize;
                    
                    // Crear canvas para la pieza
                    const pieceCanvas = document.createElement('canvas');
                    pieceCanvas.width = pieceSize;
                    pieceCanvas.height = pieceSize;
                    const pieceCtx = pieceCanvas.getContext('2d');
                    pieceCtx.drawImage(
                        canvas,
                        col * pieceSize, row * pieceSize, pieceSize, pieceSize,
                        0, 0, pieceSize, pieceSize
                    );
                    
                    piece.style.backgroundImage = `url(${pieceCanvas.toDataURL()})`;
                    piece.style.backgroundPosition = `${bgX}px ${bgY}px`;
                    
                    // Hacer arrastrable
                    makeDraggable(piece);
                    
                    // Agregar al contenedor de piezas
                    piecesContainer.appendChild(piece);
                    pieces.push(piece);
                }
            }
            
            // Mezclar piezas
            shufflePieces();
        }
        
        function makeDraggable(piece) {
            let offsetX, offsetY;
            let isDragging = false;
            
            piece.addEventListener('mousedown', startDrag);
            piece.addEventListener('touchstart', startDrag);
            
            function startDrag(e) {
                if (piece.classList.contains('placed')) return;
                
                isDragging = true;
                
                // Calcular offset
                const rect = piece.getBoundingClientRect();
                if (e.type === 'mousedown') {
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                } else {
                    offsetX = e.touches[0].clientX - rect.left;
                    offsetY = e.touches[0].clientY - rect.top;
                }
                
                // Estilo durante el arrastre
                piece.style.position = 'absolute';
                piece.style.zIndex = '100';
                piece.style.transform = 'scale(1.1)';
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag);
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
                
                e.preventDefault();
            }
            
            function drag(e) {
                if (!isDragging) return;
                
                const clientX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const clientY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;
                
                piece.style.left = (clientX - offsetX) + 'px';
                piece.style.top = (clientY - offsetY) + 'px';
            }
            
            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                
                piece.style.transform = '';
                
                // Verificar si está sobre el puzzle container
                const puzzleRect = puzzleContainer.getBoundingClientRect();
                const pieceRect = piece.getBoundingClientRect();
                const pieceCenterX = pieceRect.left + pieceRect.width / 2;
                const pieceCenterY = pieceRect.top + pieceRect.height / 2;
                
                if (pieceCenterX > puzzleRect.left && pieceCenterX < puzzleRect.right &&
                    pieceCenterY > puzzleRect.top && pieceCenterY < puzzleRect.bottom) {
                    
                    // Calcular posición correcta
                    const targetCol = Math.floor((pieceCenterX - puzzleRect.left) / pieceSize);
                    const targetRow = Math.floor((pieceCenterY - puzzleRect.top) / pieceSize);
                    
                    // Verificar si es la posición correcta
                    if (parseInt(piece.dataset.row) === targetRow && 
                        parseInt(piece.dataset.col) === targetCol) {
                        
                        // Colocar en la posición correcta
                        piece.classList.add('placed');
                        piece.style.left = (targetCol * pieceSize) + 'px';
                        piece.style.top = (targetRow * pieceSize) + 'px';
                        piece.style.cursor = 'default';
                        
                        // Verificar si el puzzle está completo
                        placedPieces++;
                        if (placedPieces === GRID_SIZE * GRID_SIZE) {
                            showSuccess();
                        }
                    } else {
                        // Volver al contenedor de piezas
                        piecesContainer.appendChild(piece);
                        piece.style.position = 'relative';
                        piece.style.left = '';
                        piece.style.top = '';
                    }
                } else {
                    // Volver al contenedor de piezas
                    piecesContainer.appendChild(piece);
                    piece.style.position = 'relative';
                    piece.style.left = '';
                    piece.style.top = '';
                }
                
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', endDrag);
                document.removeEventListener('touchend', endDrag);
            }
        }
        
        function shufflePieces() {
            // Mezclar el orden de las piezas
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                piecesContainer.appendChild(pieces[j]);
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }
        }
        
        function showSuccess() {
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 2000);
        }
        
        // Iniciar el juego
        window.addEventListener('load', initGame);
        window.addEventListener('resize', function() {
            if (window.innerWidth <= 900 && boardSize !== 300) {
                initGame();
            } else if (window.innerWidth > 900 && boardSize !== 400) {
                initGame();
            }
        });
    </script>
</body>
</html>
