<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rompecabezas de Carta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }
        
        h1 {
            color: #2c3e50;
            margin: 20px 0;
            text-align: center;
        }
        
        .game-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        
        #puzzle-container {
            width: 816px; /* Tamaño carta en pixels (8.5x11 pulgadas a 96dpi) */
            height: 1056px;
            border: 3px solid #2c3e50;
            border-radius: 10px;
            background-color: #ecf0f1;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        #pieces-container {
            width: 816px;
            height: 1056px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
            padding: 10px;
            border: 2px dashed #7f8c8d;
            border-radius: 10px;
            background-color: rgba(255,255,255,0.5);
            overflow-y: auto;
        }
        
        .puzzle-piece {
            background-size: cover;
            position: relative;
            cursor: grab;
            transition: transform 0.1s;
            border: 2px solid #fff;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
        }
        
        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .puzzle-piece.placed {
            position: absolute;
            cursor: default;
            box-shadow: none;
        }
        
        #controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        
        button {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: 600;
        }
        
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        #difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        #difficulty-selector button {
            padding: 8px 15px;
            background-color: #95a5a6;
        }
        
        #difficulty-selector button.active {
            background-color: #27ae60;
        }
        
        #success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s;
        }
        
        #music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: rgba(52, 152, 219, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        #music-control i {
            color: white;
            font-size: 24px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @media (max-width: 1800px) {
            .game-area {
                flex-direction: column;
                align-items: center;
            }
            
            #puzzle-container, #pieces-container {
                width: 612px; /* 75% del tamaño carta */
                height: 792px;
            }
        }
        
        @media (max-width: 700px) {
            #puzzle-container, #pieces-container {
                width: 408px; /* 50% del tamaño carta */
                height: 528px;
            }
            
            #difficulty-selector {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <h1>Rompecabezas de Carta</h1>
    
    <div id="difficulty-selector">
        <button data-difficulty="2" class="active">Fácil (2×2)</button>
        <button data-difficulty="3">Medio (3×3)</button>
        <button data-difficulty="4">Difícil (4×4)</button>
        <button data-difficulty="5">Experto (5×5)</button>
    </div>
    
    <div class="game-area">
        <div id="puzzle-container"></div>
        <div id="pieces-container"></div>
    </div>
    
    <div id="controls">
        <button id="start-btn">Nuevo Juego</button>
    </div>
    
    <div id="success-message">¡Rompecabezas Completo!</div>
    
    <div id="music-control" title="Música ON/OFF">
        <i class="fas fa-music"></i>
    </div>
    
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // Configuración del juego
        let GRID_SIZE = 2; // Valor inicial: Fácil
        const IMAGE_URL = 'puzzle.jpg'; // Nombre de tu imagen
        
        // Elementos del DOM
        const puzzleContainer = document.getElementById('puzzle-container');
        const piecesContainer = document.getElementById('pieces-container');
        const startBtn = document.getElementById('start-btn');
        const successMessage = document.getElementById('success-message');
        const difficultyButtons = document.querySelectorAll('#difficulty-selector button');
        const musicControl = document.getElementById('music-control');
        const bgMusic = document.getElementById('bg-music');
        
        // Variables del juego
        let pieces = [];
        let placedPieces = 0;
        let boardWidth = 816; // Tamaño carta en pixels (8.5x11" a 96dpi)
        let boardHeight = 1056;
        let pieceWidth = 0;
        let pieceHeight = 0;
        let imgObj = null;
        let isMusicOn = false;
        
        // Inicializar el juego
        function initGame() {
            // Ajustar tamaño según dispositivo
            adjustBoardSize();
            
            puzzleContainer.style.width = boardWidth + 'px';
            puzzleContainer.style.height = boardHeight + 'px';
            piecesContainer.style.width = boardWidth + 'px';
            piecesContainer.style.height = boardHeight + 'px';
            
            pieceWidth = boardWidth / GRID_SIZE;
            pieceHeight = boardHeight / GRID_SIZE;
            
            // Cargar la imagen
            loadImage();
            
            // Event listeners
            startBtn.addEventListener('click', initGame);
            
            // Configurar botones de dificultad
            difficultyButtons.forEach(button => {
                button.addEventListener('click', function() {
                    difficultyButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    GRID_SIZE = parseInt(this.dataset.difficulty);
                    initGame();
                });
            });
            
            // Control de música
            musicControl.addEventListener('click', toggleMusic);
            
            // Reproducir música después de interacción del usuario
            document.addEventListener('click', initMusic, { once: true });
        }
        
        function adjustBoardSize() {
            if (window.innerWidth <= 700) {
                boardWidth = 408; // 50% del tamaño carta
                boardHeight = 528;
            } else if (window.innerWidth <= 1800) {
                boardWidth = 612; // 75% del tamaño carta
                boardHeight = 792;
            } else {
                boardWidth = 816; // Tamaño carta completo
                boardHeight = 1056;
            }
        }
        
        function initMusic() {
            // Solo se ejecuta una vez después del primer clic del usuario
            isMusicOn = true;
            bgMusic.volume = 0.3;
            bgMusic.play().catch(e => console.log("Error al reproducir música:", e));
            musicControl.innerHTML = '<i class="fas fa-volume-up"></i>';
        }
        
        function toggleMusic() {
            isMusicOn = !isMusicOn;
            
            if(isMusicOn) {
                bgMusic.play().catch(e => console.log("Error al reproducir música:", e));
                musicControl.innerHTML = '<i class="fas fa-volume-up"></i>';
                musicControl.title = "Música OFF";
            } else {
                bgMusic.pause();
                musicControl.innerHTML = '<i class="fas fa-volume-mute"></i>';
                musicControl.title = "Música ON";
            }
        }
        
        function loadImage() {
            if (imgObj) {
                createPuzzlePieces(imgObj);
                return;
            }
            
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = IMAGE_URL;
            
            img.onload = function() {
                imgObj = img;
                createPuzzlePieces(img);
            };
            
            img.onerror = function() {
                alert('Error al cargar la imagen. Asegúrate de que se llame "puzzle.jpg" y esté en la misma carpeta.');
            };
        }
        
        function createPuzzlePieces(img) {
            // Limpiar contenedores
            puzzleContainer.innerHTML = '';
            piecesContainer.innerHTML = '';
            pieces = [];
            placedPieces = 0;
            successMessage.style.display = 'none';
            
            // Crear canvas temporal para la imagen completa
            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = boardWidth;
            fullCanvas.height = boardHeight;
            const fullCtx = fullCanvas.getContext('2d');
            
            // Dibujar imagen preservando la proporción
            const imgRatio = img.width / img.height;
            const containerRatio = boardWidth / boardHeight;
            
            let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
            
            if (imgRatio > containerRatio) {
                // Imagen más ancha que el contenedor
                drawWidth = boardWidth;
                drawHeight = boardWidth / imgRatio;
                offsetY = (boardHeight - drawHeight) / 2;
            } else {
                // Imagen más alta que el contenedor
                drawHeight = boardHeight;
                drawWidth = boardHeight * imgRatio;
                offsetX = (boardWidth - drawWidth) / 2;
            }
            
            // Dibujar con suavizado para mejor calidad
            fullCtx.imageSmoothingEnabled = true;
            fullCtx.imageSmoothingQuality = 'high';
            fullCtx.fillStyle = '#ecf0f1'; // Color de fondo para áreas vacías
            fullCtx.fillRect(0, 0, boardWidth, boardHeight);
            fullCtx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
            
            // Crear piezas individuales
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const piece = createPiece(fullCanvas, row, col);
                    piecesContainer.appendChild(piece);
                    pieces.push(piece);
                }
            }
            
            // Mezclar piezas
            shufflePieces();
        }
        
        function createPiece(fullCanvas, row, col) {
            const piece = document.createElement('div');
            piece.className = 'puzzle-piece';
            piece.style.width = pieceWidth + 'px';
            piece.style.height = pieceHeight + 'px';
            piece.dataset.row = row;
            piece.dataset.col = col;
            
            // Crear canvas para la pieza individual
            const pieceCanvas = document.createElement('canvas');
            pieceCanvas.width = pieceWidth;
            pieceCanvas.height = pieceHeight;
            const pieceCtx = pieceCanvas.getContext('2d');
            
            // Activar suavizado para mejor calidad
            pieceCtx.imageSmoothingEnabled = true;
            pieceCtx.imageSmoothingQuality = 'high';
            
            // Extraer fragmento de la imagen
            pieceCtx.drawImage(
                fullCanvas,
                col * pieceWidth, row * pieceHeight, pieceWidth, pieceHeight,
                0, 0, pieceWidth, pieceHeight
            );
            
            // Aplicar la imagen como fondo
            piece.style.backgroundImage = `url(${pieceCanvas.toDataURL('image/jpeg', 1.0)})`;
            
            // Hacer arrastrable
            makeDraggable(piece);
            
            return piece;
        }
        
        function makeDraggable(piece) {
            let offsetX, offsetY;
            let isDragging = false;
            
            piece.addEventListener('mousedown', startDrag);
            piece.addEventListener('touchstart', startDrag, { passive: false });
            
            function startDrag(e) {
                if (piece.classList.contains('placed')) return;
                
                isDragging = true;
                
                // Calcular offset
                const rect = piece.getBoundingClientRect();
                if (e.type === 'mousedown') {
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                } else {
                    offsetX = e.touches[0].clientX - rect.left;
                    offsetY = e.touches[0].clientY - rect.top;
                    e.preventDefault(); // Prevenir scroll en móviles
                }
                
                // Estilo durante el arrastre
                piece.style.position = 'absolute';
                piece.style.zIndex = '100';
                piece.style.transform = 'scale(1.1)';
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
            }
            
            function drag(e) {
                if (!isDragging) return;
                
                const clientX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const clientY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;
                
                piece.style.left = (clientX - offsetX) + 'px';
                piece.style.top = (clientY - offsetY) + 'px';
                
                if (e.type === 'touchmove') {
                    e.preventDefault(); // Prevenir scroll en móviles
                }
            }
            
            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                
                piece.style.transform = '';
                
                // Verificar si está sobre el puzzle container
                const puzzleRect = puzzleContainer.getBoundingClientRect();
                const pieceRect = piece.getBoundingClientRect();
                const pieceCenterX = pieceRect.left + pieceRect.width / 2;
                const pieceCenterY = pieceRect.top + pieceRect.height / 2;
                
                if (pieceCenterX > puzzleRect.left && pieceCenterX < puzzleRect.right &&
                    pieceCenterY > puzzleRect.top && pieceCenterY < puzzleRect.bottom) {
                    
                    // Calcular posición correcta
                    const targetCol = Math.floor((pieceCenterX - puzzleRect.left) / pieceWidth);
                    const targetRow = Math.floor((pieceCenterY - puzzleRect.top) / pieceHeight);
                    
                    // Verificar si es la posición correcta
                    if (parseInt(piece.dataset.row) === targetRow && 
                        parseInt(piece.dataset.col) === targetCol) {
                        
                        // Colocar en la posición correcta
                        placePiece(piece, targetRow, targetCol);
                    } else {
                        returnToPiecesContainer(piece);
                    }
                } else {
                    returnToPiecesContainer(piece);
                }
                
                removeDragListeners();
            }
            
            function placePiece(piece, row, col) {
                puzzleContainer.appendChild(piece);
                piece.classList.add('placed');
                piece.style.left = (col * pieceWidth) + 'px';
                piece.style.top = (row * pieceHeight) + 'px';
                piece.style.cursor = 'default';
                
                // Verificar si el puzzle está completo
                placedPieces++;
                if (placedPieces === GRID_SIZE * GRID_SIZE) {
                    showSuccess();
                }
            }
            
            function returnToPiecesContainer(piece) {
                piecesContainer.appendChild(piece);
                piece.style.position = 'relative';
                piece.style.left = '';
                piece.style.top = '';
            }
            
            function removeDragListeners() {
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', endDrag);
                document.removeEventListener('touchend', endDrag);
            }
        }
        
        function shufflePieces() {
            // Mezclar el orden de las piezas
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                piecesContainer.appendChild(pieces[j]);
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }
        }
        
        function showSuccess() {
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 2000);
        }
        
        // Iniciar el juego
        window.addEventListener('load', initGame);
        window.addEventListener('resize', function() {
            adjustBoardSize();
            initGame();
        });
    </script>
</body>
</html>
