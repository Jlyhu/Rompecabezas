<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ser familia de todas formas</title>
    <style>
        @font-face {
            font-family: 'Pixie Ring';
            src: url('https://fonts.cdnfonts.com/css/pixie-ring') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF8E1 0%, #FFE0B2 100%);
            padding: 10px;
            overflow-x: hidden;
        }
        
        h1 {
            font-family: 'Pixie Ring', cursive;
            color: #5D4037;
            margin: 10px 0;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            letter-spacing: 1px;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            flex: 1;
        }
        
        .game-area {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 10px 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #puzzle-container {
            width: 90vmin;
            height: calc(90vmin * 1.294); /* Proporción carta */
            max-width: 612px;
            max-height: 792px;
            border: 3px solid #5D4037;
            border-radius: 10px;
            background-color: #D2B48C;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            z-index: 1;
            margin-bottom: 10px;
        }
        
        #pieces-area {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            z-index: 2;
        }
        
        .puzzle-piece {
            background-size: cover;
            cursor: grab;
            transition: all 0.2s ease;
            border: 2px solid #FFF3E0;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            background-color: #FFF3E0;
            z-index: 10;
            width: calc(90vmin / var(--grid-size) - 20px);
            height: calc(90vmin * 1.294 / var(--grid-size) - 20px);
            max-width: calc(612px / var(--grid-size) - 20px);
            max-height: calc(792px / var(--grid-size) - 20px);
        }
        
        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(1.03);
            z-index: 100;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        
        .puzzle-piece.placed {
            position: absolute;
            cursor: default;
            box-shadow: none;
            border: 1px solid rgba(93, 64, 55, 0.3);
            z-index: 1;
        }
        
        #controls {
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
            width: 100%;
        }
        
        #difficulty-selector {
            display: flex;
            gap: 10px;
            background-color: #FFF3E0;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 10px 20px;
            background-color: #E64A19;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-weight: 600;
            min-width: 120px;
        }
        
        button:hover {
            background-color: #BF360C;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        
        #difficulty-selector button {
            padding: 6px 12px;
            background-color: #A1887F;
            color: #FFF;
            font-size: 12px;
            min-width: auto;
        }
        
        #difficulty-selector button.active {
            background-color: #5D4037;
        }
        
        #success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(67, 160, 71, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: fadeIn 0.5s;
        }
        
        #music-control {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background-color: rgba(230, 74, 25, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
        
        #music-control i {
            color: white;
            font-size: 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @media (max-width: 500px) {
            #puzzle-container {
                width: 85vmin;
                height: calc(85vmin * 1.294);
            }
            
            .puzzle-piece {
                width: calc(85vmin / var(--grid-size) - 15px);
                height: calc(85vmin * 1.294 / var(--grid-size) - 15px);
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.cdnfonts.com/css/pixie-ring" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <h1>Ser familia de todas formas</h1>
        
        <div id="controls">
            <div id="difficulty-selector">
                <button data-difficulty="2" class="active">Fácil (2×2)</button>
                <button data-difficulty="3">Medio (3×3)</button>
                <button data-difficulty="4">Difícil (4×4)</button>
                <button data-difficulty="5">Experto (5×5)</button>
            </div>
            
            <button id="start-btn">Nuevo Juego</button>
        </div>
        
        <div class="game-area">
            <div id="puzzle-container"></div>
            <div id="pieces-area"></div>
        </div>
    </div>
    
    <div id="success-message">¡Rompecabezas Completo!</div>
    
    <div id="music-control" title="Música ON/OFF">
        <i class="fas fa-music"></i>
    </div>
    
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="piece-sound">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-beep-221.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // Configuración del juego
        let GRID_SIZE = 2;
        const IMAGE_URL = 'puzzle.jpg';
        
        // Elementos del DOM
        const puzzleContainer = document.getElementById('puzzle-container');
        const piecesArea = document.getElementById('pieces-area');
        const startBtn = document.getElementById('start-btn');
        const successMessage = document.getElementById('success-message');
        const difficultyButtons = document.querySelectorAll('#difficulty-selector button');
        const musicControl = document.getElementById('music-control');
        const bgMusic = document.getElementById('bg-music');
        const pieceSound = document.getElementById('piece-sound');
        
        // Variables del juego
        let pieces = [];
        let placedPieces = 0;
        let boardWidth = 0;
        let boardHeight = 0;
        let pieceWidth = 0;
        let pieceHeight = 0;
        let imgObj = null;
        let isMusicOn = false;
        
        // Inicializar el juego
        function initGame() {
            calculateSizes();
            
            pieceWidth = boardWidth / GRID_SIZE;
            pieceHeight = boardHeight / GRID_SIZE;
            
            loadImage();
            
            // Configurar eventos
            startBtn.addEventListener('click', initGame);
            
            difficultyButtons.forEach(button => {
                button.addEventListener('click', function() {
                    difficultyButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    GRID_SIZE = parseInt(this.dataset.difficulty);
                    initGame();
                });
            });
            
            musicControl.addEventListener('click', toggleMusic);
            document.addEventListener('click', initMusic, { once: true });
        }
        
        function calculateSizes() {
            // Usamos vmin para que se adapte al tamaño de pantalla
            boardWidth = Math.min(612, window.innerWidth * 0.9);
            boardHeight = boardWidth * 1.294; // Proporción carta
            
            puzzleContainer.style.width = boardWidth + 'px';
            puzzleContainer.style.height = boardHeight + 'px';
            
            // Actualizar CSS variables para las piezas
            document.documentElement.style.setProperty('--grid-size', GRID_SIZE);
        }
        
        function initMusic() {
            isMusicOn = true;
            bgMusic.volume = 0.2;
            bgMusic.play().catch(e => console.log("Error al reproducir música:", e));
            musicControl.innerHTML = '<i class="fas fa-volume-up"></i>';
        }
        
        function toggleMusic() {
            isMusicOn = !isMusicOn;
            
            if(isMusicOn) {
                bgMusic.play().catch(e => console.log("Error al reproducir música:", e));
                musicControl.innerHTML = '<i class="fas fa-volume-up"></i>';
                musicControl.title = "Música OFF";
            } else {
                bgMusic.pause();
                musicControl.innerHTML = '<i class="fas fa-volume-mute"></i>';
                musicControl.title = "Música ON";
            }
        }
        
        function playPieceSound() {
            if (isMusicOn) {
                pieceSound.currentTime = 0;
                pieceSound.play().catch(e => console.log("Error al reproducir sonido:", e));
            }
        }
        
        function loadImage() {
            if (imgObj) {
                createPuzzlePieces(imgObj);
                return;
            }
            
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = IMAGE_URL;
            
            img.onload = function() {
                imgObj = img;
                createPuzzlePieces(img);
            };
            
            img.onerror = function() {
                alert('Error al cargar la imagen. Asegúrate de que se llame "puzzle.jpg" y esté en la misma carpeta.');
            };
        }
        
        function createPuzzlePieces(img) {
            puzzleContainer.innerHTML = '';
            piecesArea.innerHTML = '';
            pieces = [];
            placedPieces = 0;
            successMessage.style.display = 'none';
            
            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = boardWidth;
            fullCanvas.height = boardHeight;
            const fullCtx = fullCanvas.getContext('2d');
            
            fullCtx.fillStyle = '#D2B48C';
            fullCtx.fillRect(0, 0, boardWidth, boardHeight);
            
            // Ajustar imagen para que llene el contenedor manteniendo proporción
            const imgRatio = img.width / img.height;
            const containerRatio = boardWidth / boardHeight;
            
            let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
            
            if (imgRatio > containerRatio) {
                // Imagen más ancha que el contenedor
                drawHeight = boardHeight;
                drawWidth = drawHeight * imgRatio;
                offsetX = (boardWidth - drawWidth) / 2;
            } else {
                // Imagen más alta que el contenedor
                drawWidth = boardWidth;
                drawHeight = drawWidth / imgRatio;
                offsetY = (boardHeight - drawHeight) / 2;
            }
            
            fullCtx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
            
            // Crear piezas
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const piece = createPiece(fullCanvas, row, col);
                    piecesArea.appendChild(piece);
                    pieces.push(piece);
                }
            }
        }
        
        function createPiece(fullCanvas, row, col) {
            const piece = document.createElement('div');
            piece.className = 'puzzle-piece';
            piece.dataset.row = row;
            piece.dataset.col = col;
            
            // Crear imagen de la pieza
            const pieceCanvas = document.createElement('canvas');
            pieceCanvas.width = pieceWidth;
            pieceCanvas.height = pieceHeight;
            const pieceCtx = pieceCanvas.getContext('2d');
            
            pieceCtx.imageSmoothingEnabled = true;
            pieceCtx.imageSmoothingQuality = 'high';
            
            pieceCtx.drawImage(
                fullCanvas,
                col * pieceWidth, row * pieceHeight, pieceWidth, pieceHeight,
                0, 0, pieceWidth, pieceHeight
            );
            
            piece.style.backgroundImage = `url(${pieceCanvas.toDataURL('image/jpeg', 1.0)})`;
            
            makeDraggable(piece);
            
            return piece;
        }
        
        function makeDraggable(piece) {
            let offsetX, offsetY;
            let isDragging = false;
            let originalX, originalY;
            
            piece.addEventListener('mousedown', startDrag);
            piece.addEventListener('touchstart', startDrag, { passive: false });
            
            function startDrag(e) {
                if (piece.classList.contains('placed')) return;
                
                isDragging = true;
                
                const rect = piece.getBoundingClientRect();
                if (e.type === 'mousedown') {
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                } else {
                    offsetX = e.touches[0].clientX - rect.left;
                    offsetY = e.touches[0].clientY - rect.top;
                    e.preventDefault();
                }
                
                // Guardar posición original
                originalX = rect.left;
                originalY = rect.top;
                
                piece.style.position = 'fixed';
                piece.style.zIndex = '100';
                piece.style.transform = 'scale(1.03)';
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
            }
            
            function drag(e) {
                if (!isDragging) return;
                
                const clientX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const clientY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;
                
                piece.style.left = (clientX - offsetX) + 'px';
                piece.style.top = (clientY - offsetY) + 'px';
                
                if (e.type === 'touchmove') {
                    e.preventDefault();
                }
            }
            
            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                
                piece.style.transform = '';
                
                const puzzleRect = puzzleContainer.getBoundingClientRect();
                const pieceRect = piece.getBoundingClientRect();
                const pieceCenterX = pieceRect.left + pieceRect.width / 2;
                const pieceCenterY = pieceRect.top + pieceRect.height / 2;
                
                // Verificar si está sobre el puzzle container
                if (pieceCenterX > puzzleRect.left && pieceCenterX < puzzleRect.right &&
                    pieceCenterY > puzzleRect.top && pieceCenterY < puzzleRect.bottom) {
                    
                    // Calcular posición relativa dentro del puzzle
                    const relativeX = pieceCenterX - puzzleRect.left;
                    const relativeY = pieceCenterY - puzzleRect.top;
                    
                    const targetCol = Math.floor(relativeX / pieceWidth);
                    const targetRow = Math.floor(relativeY / pieceHeight);
                    
                    // Encajar la pieza sin importar si es su posición correcta
                    placePiece(piece, targetRow, targetCol);
                    playPieceSound();
                } else {
                    // Volver a la posición original
                    piece.style.position = 'static';
                    piecesArea.appendChild(piece);
                }
                
                removeDragListeners();
            }
            
            function placePiece(piece, row, col) {
                // Asegurar que las coordenadas estén dentro del rango
                const safeRow = Math.max(0, Math.min(GRID_SIZE - 1, row));
                const safeCol = Math.max(0, Math.min(GRID_SIZE - 1, col));
                
                puzzleContainer.appendChild(piece);
                piece.classList.add('placed');
                
                // Posición absoluta dentro del puzzle
                const left = safeCol * pieceWidth;
                const top = safeRow * pieceHeight;
                
                piece.style.position = 'absolute';
                piece.style.left = left + 'px';
                piece.style.top = top + 'px';
                piece.style.cursor = 'default';
                piece.style.zIndex = '1';
                
                // Verificar si está en la posición correcta
                if (parseInt(piece.dataset.row) === safeRow && 
                    parseInt(piece.dataset.col) === safeCol) {
                    placedPieces++;
                    if (placedPieces === GRID_SIZE * GRID_SIZE) {
                        showSuccess();
                    }
                }
            }
            
            function removeDragListeners() {
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', endDrag);
                document.removeEventListener('touchend', endDrag);
            }
        }
        
        function showSuccess() {
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 2000);
        }
        
        // Iniciar el juego cuando se carga la página
        window.addEventListener('load', initGame);
        
        // Redimensionar cuando cambia el tamaño de la ventana
        window.addEventListener('resize', function() {
            calculateSizes();
            initGame();
        });
    </script>
</body>
</html>
