<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ser familia de todas formas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF8E1 0%, #FFE0B2 100%);
            padding: 20px;
            overflow-x: hidden;
        }
        
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            text-align: center;
        }
        
        h1 {
            color: #5D4037;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            font-size: 2rem;
            font-weight: 600;
        }
        
        .nutella-logo {
            width: 120px;
            margin-top: 10px;
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }
        
        .game-area {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 10px 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #puzzle-container {
            width: 117vmin; /* Ancho mayor para horizontal */
            height: 90vmin; /* Alto menor para horizontal */
            max-width: 792px; /* 27.94cm en px (27.94/2.54*96) */
            max-height: 612px; /* 21.59cm en px */
            border: 3px solid #5D4037;
            border-radius: 10px;
            background-color: #D2B48C;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            z-index: 1;
            position: relative;
        }
        
        #puzzle-container .hint-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0.3;
            z-index: 0;
            display: none;
        }
        
        #pieces-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        .puzzle-piece {
            background-size: cover;
            position: absolute;
            cursor: grab;
            transition: all 0.2s ease;
            border: 2px solid #FFF3E0;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            background-color: #FFF3E0;
            z-index: 10;
            pointer-events: auto;
        }
        
        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(1.03);
            z-index: 100;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        
        .puzzle-piece.placed {
            position: absolute;
            cursor: default;
            box-shadow: none;
            border: 1px solid rgba(93, 64, 55, 0.3);
            z-index: 1;
            pointer-events: auto;
        }
        
        #controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        button {
            padding: 10px 20px;
            background-color: #E64A19;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
        }
        
        button:hover {
            background-color: #BF360C;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        #difficulty-selector {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            background-color: #FFF3E0;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        #difficulty-selector button {
            padding: 6px 12px;
            background-color: #A1887F;
            color: #FFF;
            font-size: 12px;
        }
        
        #difficulty-selector button.active {
            background-color: #5D4037;
        }
        
        #success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(67, 160, 71, 0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: fadeIn 0.5s;
        }
        
        #music-control {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background-color: rgba(230, 74, 25, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
        
        #music-control i {
            color: white;
            font-size: 18px;
        }
        
        #hint-toggle {
            background-color: #5D4037;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.6rem;
            }
            
            .nutella-logo {
                width: 100px;
            }
            
            button {
                padding: 8px 16px;
                font-size: 13px;
            }
            
            #puzzle-container {
                width: 95vmin;
                height: 73vmin; /* Mantener relación 27.94:21.59 ≈ 1.29 */
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.4rem;
            }
            
            .nutella-logo {
                width: 80px;
            }
            
            #difficulty-selector {
                gap: 5px;
            }
            
            #difficulty-selector button {
                padding: 5px 8px;
                font-size: 11px;
            }
            
            #puzzle-container {
                width: 90vmin;
                height: 70vmin;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="header">
        <h1>Ser familia de todas formas</h1>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Nutella_logo.svg/1200px-Nutella_logo.svg.png" alt="Nutella" class="nutella-logo">
    </div>
    
    <div class="game-container">
        <div id="difficulty-selector">
            <button data-difficulty="2" class="active">Fácil (2×2)</button>
            <button data-difficulty="3">Medio (3×3)</button>
            <button data-difficulty="4">Difícil (4×4)</button>
            <button data-difficulty="5">Experto (5×5)</button>
        </div>
        
        <div class="game-area">
            <div id="puzzle-container">
                <img class="hint-image" id="hint-image" src="" alt="Pista">
            </div>
            <div id="pieces-area"></div>
        </div>
        
        <div id="controls">
            <button id="start-btn">Nuevo Juego</button>
            <button id="hint-toggle">Mostrar Pista</button>
        </div>
    </div>
    
    <div id="success-message">¡Rompecabezas Completo!</div>
    
    <div id="music-control" title="Música ON/OFF">
        <i class="fas fa-music"></i>
    </div>
    
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="piece-sound">
        <source src="https://www.soundjay.com/buttons/sounds/button-09.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // Configuración del juego
        let GRID_SIZE = 2;
        const IMAGE_URL = 'puzzle.jpg';
        
        // Elementos del DOM
        const puzzleContainer = document.getElementById('puzzle-container');
        const piecesArea = document.getElementById('pieces-area');
        const startBtn = document.getElementById('start-btn');
        const hintToggle = document.getElementById('hint-toggle');
        const hintImage = document.getElementById('hint-image');
        const successMessage = document.getElementById('success-message');
        const difficultyButtons = document.querySelectorAll('#difficulty-selector button');
        const musicControl = document.getElementById('music-control');
        const bgMusic = document.getElementById('bg-music');
        const pieceSound = document.getElementById('piece-sound');
        
        // Variables del juego
        let pieces = [];
        let placedPieces = 0;
        let pieceWidth = 0;
        let pieceHeight = 0;
        let imgObj = null;
        let isMusicOn = false;
        let isFirstInteraction = true;
        let hintVisible = false;
        
        // Inicializar el juego
        function initGame() {
            calculateBoardSize();
            
            pieceWidth = puzzleContainer.offsetWidth / GRID_SIZE;
            pieceHeight = puzzleContainer.offsetHeight / GRID_SIZE;
            
            loadImage();
            
            // Configurar eventos
            startBtn.addEventListener('click', initGame);
            
            difficultyButtons.forEach(button => {
                button.addEventListener('click', function() {
                    difficultyButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    GRID_SIZE = parseInt(this.dataset.difficulty);
                    initGame();
                });
            });
            
            hintToggle.addEventListener('click', toggleHint);
            musicControl.addEventListener('click', toggleMusic);
            document.addEventListener('click', initMusic, { once: true });
        }
        
        function calculateBoardSize() {
            // Tamaño basado en relación 27.94:21.59 ≈ 1.29 (ancho:alto)
            const maxWidth = 792; // 27.94cm en px
            const maxHeight = 612; // 21.59cm en px
            
            // Calcular tamaño basado en el ancho de pantalla
            const containerWidth = Math.min(
                window.innerWidth * 0.9,
                maxWidth
            );
            const containerHeight = containerWidth / 1.29;
            
            puzzleContainer.style.width = containerWidth + 'px';
            puzzleContainer.style.height = containerHeight + 'px';
        }
        
        function toggleHint() {
            hintVisible = !hintVisible;
            
            if (hintVisible) {
                hintImage.style.display = 'block';
                hintToggle.textContent = 'Ocultar Pista';
            } else {
                hintImage.style.display = 'none';
                hintToggle.textContent = 'Mostrar Pista';
            }
        }
        
        function initMusic() {
            if (isFirstInteraction) {
                isFirstInteraction = false;
                isMusicOn = true;
                bgMusic.volume = 0.1;
                pieceSound.volume = 0.2;
                bgMusic.play().catch(e => console.log("Error al reproducir música:", e));
                musicControl.innerHTML = '<i class="fas fa-volume-up"></i>';
            }
        }
        
        function toggleMusic() {
            isMusicOn = !isMusicOn;
            
            if(isMusicOn) {
                bgMusic.play().catch(e => console.log("Error al reproducir música:", e));
                musicControl.innerHTML = '<i class="fas fa-volume-up"></i>';
                musicControl.title = "Música OFF";
            } else {
                bgMusic.pause();
                musicControl.innerHTML = '<i class="fas fa-volume-mute"></i>';
                musicControl.title = "Música ON";
            }
        }
        
        function loadImage() {
            if (imgObj) {
                createPuzzlePieces(imgObj);
                return;
            }
            
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = IMAGE_URL;
            
            img.onload = function() {
                imgObj = img;
                hintImage.src = IMAGE_URL;
                createPuzzlePieces(img);
            };
            
            img.onerror = function() {
                // Si no hay imagen, creamos un fondo de ejemplo horizontal
                imgObj = createSampleImage();
                hintImage.src = imgObj.src;
                createPuzzlePieces(imgObj);
                console.log('No se encontró puzzle.jpg, usando imagen de ejemplo');
            };
        }
        
        function createSampleImage() {
            const canvas = document.createElement('canvas');
            canvas.width = 792; // 27.94cm
            canvas.height = 612; // 21.59cm
            const ctx = canvas.getContext('2d');
            
            // Fondo degradado horizontal
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, '#FFC107');
            gradient.addColorStop(1, '#FF9800');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Texto
            ctx.fillStyle = '#5D4037';
            ctx.font = 'bold 40px Poppins';
            ctx.textAlign = 'center';
            ctx.fillText('Rompecabezas Familiar', canvas.width/2, canvas.height/2);
            ctx.font = '20px Poppins';
            ctx.fillText('Imagen horizontal 27.94cm × 21.59cm', canvas.width/2, canvas.height/2 + 40);
            
            // Convertir canvas a imagen
            const img = new Image();
            img.src = canvas.toDataURL();
            return img;
        }
        
        function createPuzzlePieces(img) {
            puzzleContainer.innerHTML = '<img class="hint-image" id="hint-image" src="' + (img.src || IMAGE_URL) + '" alt="Pista">';
            piecesArea.innerHTML = '';
            pieces = [];
            placedPieces = 0;
            successMessage.style.display = 'none';
            hintImage.style.display = 'none';
            hintVisible = false;
            hintToggle.textContent = 'Mostrar Pista';
            
            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = puzzleContainer.offsetWidth;
            fullCanvas.height = puzzleContainer.offsetHeight;
            const fullCtx = fullCanvas.getContext('2d');
            
            // Dibujar fondo de madera
            fullCtx.fillStyle = '#D2B48C';
            fullCtx.fillRect(0, 0, fullCanvas.width, fullCanvas.height);
            
            // Calcular dimensiones para que la imagen se ajuste manteniendo relación de aspecto
            const imgRatio = img.width / img.height;
            const containerRatio = fullCanvas.width / fullCanvas.height;
            
            let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
            
            if (imgRatio > containerRatio) {
                // La imagen es más ancha que el contenedor
                drawHeight = fullCanvas.height;
                drawWidth = drawHeight * imgRatio;
                offsetX = (fullCanvas.width - drawWidth) / 2;
            } else {
                // La imagen es más alta que el contenedor
                drawWidth = fullCanvas.width;
                drawHeight = drawWidth / imgRatio;
                offsetY = (fullCanvas.height - drawHeight) / 2;
            }
            
            fullCtx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
            
            // Crear piezas y distribuirlas alrededor del puzzle
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const piece = createPiece(fullCanvas, row, col);
                    piecesArea.appendChild(piece);
                    
                    // Posicionar aleatoriamente alrededor del puzzle
                    positionPieceAround(piece);
                    
                    pieces.push(piece);
                }
            }
        }
        
        function positionPieceAround(piece) {
            const gameArea = document.querySelector('.game-area');
            const areaRect = gameArea.getBoundingClientRect();
            const puzzleRect = puzzleContainer.getBoundingClientRect();
            
            const margin = 20;
            const safeArea = {
                left: areaRect.left,
                top: areaRect.top,
                right: areaRect.right,
                bottom: areaRect.bottom
            };
            
            // Convertir coordenadas globales a relativas
            const puzzleLeft = puzzleRect.left - safeArea.left;
            const puzzleTop = puzzleRect.top - safeArea.top;
            const puzzleRight = puzzleLeft + puzzleRect.width;
            const puzzleBottom = puzzleTop + puzzleRect.height;
            
            // Áreas donde pueden aparecer las piezas
            const areas = [
                { // Arriba
                    x: [margin, areaRect.width - piece.offsetWidth - margin],
                    y: [margin, puzzleTop - piece.offsetHeight - margin]
                },
                { // Derecha
                    x: [puzzleRight + margin, areaRect.width - piece.offsetWidth - margin],
                    y: [margin, areaRect.height - piece.offsetHeight - margin]
                },
                { // Abajo
                    x: [margin, areaRect.width - piece.offsetWidth - margin],
                    y: [puzzleBottom + margin, areaRect.height - piece.offsetHeight - margin]
                },
                { // Izquierda
                    x: [margin, puzzleLeft - piece.offsetWidth - margin],
                    y: [margin, areaRect.height - piece.offsetHeight - margin]
                }
            ];
            
            // Filtrar áreas válidas (donde el espacio es suficiente)
            const validAreas = areas.filter(area => {
                const widthAvailable = area.x[1] - area.x[0] > 0;
                const heightAvailable = area.y[1] - area.y[0] > 0;
                return widthAvailable && heightAvailable;
            });
            
            if (validAreas.length === 0) {
                // Si no hay espacio suficiente, colocar en cualquier lugar
                piece.style.left = Math.random() * (areaRect.width - piece.offsetWidth - margin * 2) + margin + 'px';
                piece.style.top = Math.random() * (areaRect.height - piece.offsetHeight - margin * 2) + margin + 'px';
                return;
            }
            
            // Seleccionar un área aleatoria válida
            const area = validAreas[Math.floor(Math.random() * validAreas.length)];
            
            const posX = Math.random() * (area.x[1] - area.x[0]) + area.x[0];
            const posY = Math.random() * (area.y[1] - area.y[0]) + area.y[0];
            
            piece.style.left = posX + 'px';
            piece.style.top = posY + 'px';
        }
        
        function createPiece(fullCanvas, row, col) {
            const piece = document.createElement('div');
            piece.className = 'puzzle-piece';
            piece.style.width = pieceWidth + 'px';
            piece.style.height = pieceHeight + 'px';
            piece.dataset.row = row;
            piece.dataset.col = col;
            
            const pieceCanvas = document.createElement('canvas');
            pieceCanvas.width = pieceWidth;
            pieceCanvas.height = pieceHeight;
            const pieceCtx = pieceCanvas.getContext('2d');
            
            pieceCtx.imageSmoothingEnabled = true;
            pieceCtx.imageSmoothingQuality = 'high';
            
            pieceCtx.drawImage(
                fullCanvas,
                col * pieceWidth, row * pieceHeight, pieceWidth, pieceHeight,
                0, 0, pieceWidth, pieceHeight
            );
            
            piece.style.backgroundImage = `url(${pieceCanvas.toDataURL('image/jpeg', 1.0)})`;
            
            makeDraggable(piece);
            
            return piece;
        }
        
        function makeDraggable(piece) {
            let offsetX, offsetY;
            let isDragging = false;
            let startX, startY;
            
            piece.addEventListener('mousedown', startDrag);
            piece.addEventListener('touchstart', startDrag, { passive: false });
            
            function startDrag(e) {
                if (piece.classList.contains('placed')) return;
                
                isDragging = true;
                
                const rect = piece.getBoundingClientRect();
                if (e.type === 'mousedown') {
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                } else {
                    offsetX = e.touches[0].clientX - rect.left;
                    offsetY = e.touches[0].clientY - rect.top;
                    e.preventDefault();
                }
                
                // Guardar posición inicial para posible cancelación
                startX = parseFloat(piece.style.left) || 0;
                startY = parseFloat(piece.style.top) || 0;
                
                piece.style.zIndex = '100';
                piece.style.transform = 'scale(1.03)';
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
            }
            
            function drag(e) {
                if (!isDragging) return;
                
                const clientX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const clientY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;
                
                const gameArea = document.querySelector('.game-area');
                const areaRect = gameArea.getBoundingClientRect();
                
                const leftPos = clientX - offsetX - areaRect.left;
                const topPos = clientY - offsetY - areaRect.top;
                
                piece.style.left = leftPos + 'px';
                piece.style.top = topPos + 'px';
                
                if (e.type === 'touchmove') {
                    e.preventDefault();
                }
            }
            
            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                
                piece.style.transform = '';
                
                const puzzleRect = puzzleContainer.getBoundingClientRect();
                const pieceRect = piece.getBoundingClientRect();
                const pieceCenterX = pieceRect.left + pieceRect.width / 2;
                const pieceCenterY = pieceRect.top + pieceRect.height / 2;
                
                if (pieceCenterX > puzzleRect.left && pieceCenterX < puzzleRect.right &&
                    pieceCenterY > puzzleRect.top && pieceCenterY < puzzleRect.bottom) {
                    
                    const relativeX = pieceCenterX - puzzleRect.left;
                    const relativeY = pieceCenterY - puzzleRect.top;
                    
                    const targetCol = Math.floor(relativeX / pieceWidth);
                    const targetRow = Math.floor(relativeY / pieceHeight);
                    
                    if (parseInt(piece.dataset.row) === targetRow && 
                        parseInt(piece.dataset.col) === targetCol &&
                        targetRow >= 0 && targetRow < GRID_SIZE && 
                        targetCol >= 0 && targetCol < GRID_SIZE) {
                        
                        placePiece(piece, targetRow, targetCol);
                    } else {
                        // Si no es la posición correcta pero está dentro del contenedor,
                        // dejarla donde el usuario la soltó
                        const gameArea = document.querySelector('.game-area');
                        const areaRect = gameArea.getBoundingClientRect();
                        
                        const leftPos = pieceRect.left - areaRect.left;
                        const topPos = pieceRect.top - areaRect.top;
                        
                        piece.style.left = leftPos + 'px';
                        piece.style.top = topPos + 'px';
                        piece.style.zIndex = '10';
                    }
                } else {
                    // Si está fuera del contenedor, dejarla donde el usuario la soltó
                    const gameArea = document.querySelector('.game-area');
                    const areaRect = gameArea.getBoundingClientRect();
                    
                    const leftPos = pieceRect.left - areaRect.left;
                    const topPos = pieceRect.top - areaRect.top;
                    
                    piece.style.left = leftPos + 'px';
                    piece.style.top = topPos + 'px';
                    piece.style.zIndex = '10';
                }
                
                removeDragListeners();
            }
            
            function placePiece(piece, row, col) {
                puzzleContainer.appendChild(piece);
                piece.classList.add('placed');
                
                const left = col * pieceWidth;
                const top = row * pieceHeight;
                
                piece.style.left = left + 'px';
                piece.style.top = top + 'px';
                piece.style.cursor = 'default';
                piece.style.zIndex = '1';
                
                // Reproducir sonido al colocar pieza
                if (!isFirstInteraction) {
                    pieceSound.currentTime = 0;
                    pieceSound.play().catch(e => console.log("Error al reproducir sonido:", e));
                }
                
                placedPieces++;
                if (placedPieces === GRID_SIZE * GRID_SIZE) {
                    showSuccess();
                }
            }
            
            function removeDragListeners() {
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', endDrag);
                document.removeEventListener('touchend', endDrag);
            }
        }
        
        function showSuccess() {
            successMessage.style.display = 'block';
            successMessage.textContent = '¡Rompecabezas Completo!';
            
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 2000);
        }
        
        window.addEventListener('load', initGame);
        window.addEventListener('resize', function() {
            initGame();
        });
    </script>
</body>
</html>
