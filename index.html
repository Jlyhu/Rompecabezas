<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rompecabezas Familiar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF8E1 0%, #FFE0B2 100%);
            padding: 20px;
        }
        
        h1 {
            color: #5D4037;
            margin: 20px 0;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .game-area {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 20px 0;
            height: 800px;
        }
        
        #puzzle-container {
            width: 612px;
            height: 792px;
            border: 3px solid #5D4037;
            border-radius: 10px;
            background-color: #f5e9dc; /* Cambiado a un tono más claro */
            background-image: url('https://www.transparenttextures.com/patterns/cardboard.png'); /* Textura de cartón */
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            z-index: 1;
        }
        
        #pieces-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .puzzle-piece {
            background-size: cover;
            position: absolute;
            cursor: grab;
            transition: all 0.2s ease;
            border: 2px solid #FFF3E0;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            background-color: #FFF3E0;
            z-index: 2;
        }
        
        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(1.03);
            z-index: 10;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }
        
        .puzzle-piece.placed {
            position: absolute;
            cursor: default;
            box-shadow: none;
            border: 1px solid rgba(93, 64, 55, 0.3);
            z-index: 1;
        }
        
        #controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        button {
            padding: 12px 25px;
            background-color: #E64A19;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-weight: 600;
        }
        
        button:hover {
            background-color: #BF360C;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        #difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background-color: #FFF3E0;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        
        #difficulty-selector button {
            padding: 8px 15px;
            background-color: #A1887F;
            color: #FFF;
        }
        
        #difficulty-selector button.active {
            background-color: #5D4037;
        }
        
        #success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(67, 160, 71, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: fadeIn 0.5s;
        }
        
        #music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: rgba(230, 74, 25, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }
        
        #music-control i {
            color: white;
            font-size: 24px;
        }

        #background-selector {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .bg-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #FFF;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        .bg-option:hover, .bg-option.active {
            transform: scale(1.2);
            border-color: #5D4037;
        }

        .bg-wood { background-color: #8D6E63; }
        .bg-cork { background-color: #D7CCC8; }
        .bg-felt { background-color: #81C784; }
        .bg-denim { background-color: #5C6BC0; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @media (max-width: 1200px) {
            .game-area {
                height: 700px;
            }
            #puzzle-container {
                width: 500px;
                height: 650px;
            }
        }
        
        @media (max-width: 768px) {
            .game-area {
                height: 600px;
            }
            #puzzle-container {
                width: 400px;
                height: 520px;
            }
            #difficulty-selector {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
        
        @media (max-width: 500px) {
            .game-area {
                height: 500px;
            }
            #puzzle-container {
                width: 300px;
                height: 390px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="game-container">
        <h1>Rompecabezas Familiar</h1>
        
        <div id="difficulty-selector">
            <button data-difficulty="2" class="active">Fácil (2×2)</button>
            <button data-difficulty="3">Medio (3×3)</button>
            <button data-difficulty="4">Difícil (4×4)</button>
            <button data-difficulty="5">Experto (5×5)</button>
        </div>
        
        <div id="background-selector">
            <div class="bg-option bg-wood active" data-bg="wood" title="Madera"></div>
            <div class="bg-option bg-cork" data-bg="cork" title="Corcho"></div>
            <div class="bg-option bg-felt" data-bg="felt" title="Fieltro"></div>
            <div class="bg-option bg-denim" data-bg="denim" title="Mezclilla"></div>
        </div>
        
        <div class="game-area">
            <div id="pieces-area"></div>
            <div id="puzzle-container"></div>
        </div>
        
        <div id="controls">
            <button id="start-btn">Nuevo Juego</button>
        </div>
    </div>
    
    <div id="success-message">¡Rompecabezas Completo!</div>
    
    <div id="music-control" title="Música ON/OFF">
        <i class="fas fa-music"></i>
    </div>
    
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        // Configuración del juego
        let GRID_SIZE = 2;
        const IMAGE_URL = 'puzzle.jpg';
        
        // Elementos del DOM
        const puzzleContainer = document.getElementById('puzzle-container');
        const piecesArea = document.getElementById('pieces-area');
        const startBtn = document.getElementById('start-btn');
        const successMessage = document.getElementById('success-message');
        const difficultyButtons = document.querySelectorAll('#difficulty-selector button');
        const bgOptions = document.querySelectorAll('.bg-option');
        const musicControl = document.getElementById('music-control');
        const bgMusic = document.getElementById('bg-music');
        
        // Variables del juego
        let pieces = [];
        let placedPieces = 0;
        let boardWidth = 612;
        let boardHeight = 792;
        let pieceWidth = 0;
        let pieceHeight = 0;
        let imgObj = null;
        let isMusicOn = false;
        let currentBackground = 'wood';
        
        // Mapeo de fondos
        const backgrounds = {
            wood: {
                color: '#f5e9dc',
                texture: 'url("https://www.transparenttextures.com/patterns/wood-pattern.png")'
            },
            cork: {
                color: '#e8e0d5',
                texture: 'url("https://www.transparenttextures.com/patterns/cardboard.png")'
            },
            felt: {
                color: '#dcedc8',
                texture: 'url("https://www.transparenttextures.com/patterns/felt.png")'
            },
            denim: {
                color: '#d0d9ff',
                texture: 'url("https://www.transparenttextures.com/patterns/denim.png")'
            }
        };
        
        // Inicializar el juego
        function initGame() {
            adjustBoardSize();
            
            puzzleContainer.style.width = boardWidth + 'px';
            puzzleContainer.style.height = boardHeight + 'px';
            
            pieceWidth = boardWidth / GRID_SIZE;
            pieceHeight = boardHeight / GRID_SIZE;
            
            loadImage();
            
            // Configurar eventos
            startBtn.addEventListener('click', initGame);
            
            difficultyButtons.forEach(button => {
                button.addEventListener('click', function() {
                    difficultyButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    GRID_SIZE = parseInt(this.dataset.difficulty);
                    initGame();
                });
            });
            
            bgOptions.forEach(option => {
                option.addEventListener('click', function() {
                    bgOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');
                    currentBackground = this.dataset.bg;
                    applyBackground();
                });
            });
            
            musicControl.addEventListener('click', toggleMusic);
            document.addEventListener('click', initMusic, { once: true });
            
            // Aplicar fondo inicial
            applyBackground();
        }
        
        function applyBackground() {
            const bg = backgrounds[currentBackground];
            puzzleContainer.style.backgroundColor = bg.color;
            puzzleContainer.style.backgroundImage = bg.texture;
        }
        
        function adjustBoardSize() {
            if (window.innerWidth <= 500) {
                boardWidth = 300;
                boardHeight = 390;
            } else if (window.innerWidth <= 768) {
                boardWidth = 400;
                boardHeight = 520;
            } else if (window.innerWidth <= 1200) {
                boardWidth = 500;
                boardHeight = 650;
            } else {
                boardWidth = 612;
                boardHeight = 792;
            }
        }
        
        function initMusic() {
            isMusicOn = true;
            bgMusic.volume = 0.2;
            bgMusic.play().catch(e => console.log("Error al reproducir música:", e));
            musicControl.innerHTML = '<i class="fas fa-volume-up"></i>';
        }
        
        function toggleMusic() {
            isMusicOn = !isMusicOn;
            
            if(isMusicOn) {
                bgMusic.play().catch(e => console.log("Error al reproducir música:", e));
                musicControl.innerHTML = '<i class="fas fa-volume-up"></i>';
                musicControl.title = "Música OFF";
            } else {
                bgMusic.pause();
                musicControl.innerHTML = '<i class="fas fa-volume-mute"></i>';
                musicControl.title = "Música ON";
            }
        }
        
        function loadImage() {
            if (imgObj) {
                createPuzzlePieces(imgObj);
                return;
            }
            
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = IMAGE_URL;
            
            img.onload = function() {
                imgObj = img;
                createPuzzlePieces(img);
            };
            
            img.onerror = function() {
                alert('Error al cargar la imagen. Asegúrate de que se llame "puzzle.jpg" y esté en la misma carpeta.');
            };
        }
        
        function createPuzzlePieces(img) {
            puzzleContainer.innerHTML = '';
            piecesArea.innerHTML = '';
            pieces = [];
            placedPieces = 0;
            successMessage.style.display = 'none';
            
            // Cálculo mejorado para llenar completamente el contenedor
            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = boardWidth;
            fullCanvas.height = boardHeight;
            const fullCtx = fullCanvas.getContext('2d');
            
            // Primero pintamos el fondo para áreas transparentes
            fullCtx.fillStyle = backgrounds[currentBackground].color;
            fullCtx.fillRect(0, 0, boardWidth, boardHeight);
            
            // Dimensiones para ajustar la imagen
            let drawWidth, drawHeight;
            const imgRatio = img.width / img.height;
            const containerRatio = boardWidth / boardHeight;
            
            // Fill mode - la imagen siempre llenará el contenedor completamente
            if (imgRatio > containerRatio) {
                // Imagen más ancha que el contenedor - ajustar por altura
                drawHeight = boardHeight;
                drawWidth = drawHeight * imgRatio;
                const offsetX = (boardWidth - drawWidth) / 2;
                fullCtx.drawImage(img, offsetX, 0, drawWidth, drawHeight);
            } else {
                // Imagen más alta que el contenedor - ajustar por ancho
                drawWidth = boardWidth;
                drawHeight = drawWidth / imgRatio; 
                const offsetY = (boardHeight - drawHeight) / 2;
                fullCtx.drawImage(img, 0, offsetY, drawWidth, drawHeight);
            }
            
            // Crear piezas y distribuirlas alrededor del puzzle
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const piece = createPiece(fullCanvas, row, col);
                    piecesArea.appendChild(piece);
                    
                    // Posicionar aleatoriamente alrededor del puzzle
                    positionPieceAround(piece);
                    
                    pieces.push(piece);
                }
            }
        }
        
        function positionPieceAround(piece) {
            const gameArea = document.querySelector('.game-area');
            const areaRect = gameArea.getBoundingClientRect();
            const puzzleRect = puzzleContainer.getBoundingClientRect();
            
            // Calcular área disponible alrededor del puzzle
            const margin = 20; // Margen del borde
            
            let posX, posY;
            const side = Math.floor(Math.random() * 4); // 0: arriba, 1: derecha, 2: abajo, 3: izquierda
            
            // Convertir coordenadas globales a relativas
            const puzzleLeft = puzzleRect.left - areaRect.left;
            const puzzleTop = puzzleRect.top - areaRect.top;
            const puzzleRight = puzzleLeft + puzzleRect.width;
            const puzzleBottom = puzzleTop + puzzleRect.height;
            
            switch (side) {
                case 0: // Arriba
                    posX = Math.random() * (areaRect.width - pieceWidth - margin * 2) + margin;
                    posY = Math.random() * (puzzleTop - pieceHeight - margin) + margin;
                    break;
                case 1: // Derecha
                    posX = puzzleRight + Math.random() * (areaRect.width - puzzleRight - pieceWidth - margin) + margin;
                    posY = Math.random() * (areaRect.height - pieceHeight - margin * 2) + margin;
                    break;
                case 2: // Abajo
                    posX = Math.random() * (areaRect.width - pieceWidth - margin * 2) + margin;
                    posY = puzzleBottom + Math.random() * (areaRect.height - puzzleBottom - pieceHeight - margin) + margin;
                    break;
                case 3: // Izquierda
                    posX = Math.random() * (puzzleLeft - pieceWidth - margin) + margin;
                    posY = Math.random() * (areaRect.height - pieceHeight - margin * 2) + margin;
                    break;
            }
            
            // Asegurarse de que la pieza está completamente dentro del área
            posX = Math.max(margin, Math.min(areaRect.width - pieceWidth - margin, posX));
            posY = Math.max(margin, Math.min(areaRect.height - pieceHeight - margin, posY));
            
            piece.style.left = posX + 'px';
            piece.style.top = posY + 'px';
        }
        
        function createPiece(fullCanvas, row, col) {
            const piece = document.createElement('div');
            piece.className = 'puzzle-piece';
            piece.style.width = pieceWidth + 'px';
            piece.style.height = pieceHeight + 'px';
            piece.dataset.row = row;
            piece.dataset.col = col;
            
            const pieceCanvas = document.createElement('canvas');
            pieceCanvas.width = pieceWidth;
            pieceCanvas.height = pieceHeight;
            const pieceCtx = pieceCanvas.getContext('2d');
            
            pieceCtx.imageSmoothingEnabled = true;
            pieceCtx.imageSmoothingQuality = 'high';
            
            pieceCtx.drawImage(
                fullCanvas,
                col * pieceWidth, row * pieceHeight, pieceWidth, pieceHeight,
                0, 0, pieceWidth, pieceHeight
            );
            
            piece.style.backgroundImage = `url(${pieceCanvas.toDataURL('image/jpeg', 1.0)})`;
            
            makeDraggable(piece);
            
            return piece;
        }
        
        function makeDraggable(piece) {
            let offsetX, offsetY;
            let isDragging = false;
            let startX, startY;
            
            piece.addEventListener('mousedown', startDrag);
            piece.addEventListener('touchstart', startDrag, { passive: false });
            
            function startDrag(e) {
                if (piece.classList.contains('placed')) return;
                
                isDragging = true;
                
                const rect = piece.getBoundingClientRect();
                if (e.type === 'mousedown') {
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                    startX = rect.left;
                    startY = rect.top;
                } else {
                    offsetX = e.touches[0].clientX - rect.left;
                    offsetY = e.touches[0].clientY - rect.top;
                    startX = rect.left;
                    startY = rect.top;
                    e.preventDefault();
                }
                
                // Traer al frente
                piece.style.zIndex = '100';
                piece.style.transform = 'scale(1.03)';
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
            }
            
            function drag(e) {
                if (!isDragging) return;
                
                const clientX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const clientY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;
                
                const gameArea = document.querySelector('.game-area');
                const areaRect = gameArea.getBoundingClientRect();
                
                // Posición relativa al área de juego
                const leftPos = clientX - offsetX - areaRect.left;
                const topPos = clientY - offsetY - areaRect.top;
                
                piece.style.left = leftPos + 'px';
                piece.style.top = topPos + 'px';
                
                if (e.type === 'touchmove') {
                    e.preventDefault();
                }
            }
            
            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                
                piece.style.transform = '';
                
                const puzzleRect = puzzleContainer.getBoundingClientRect();
                const pieceRect = piece.getBoundingClientRect();
                const pieceCenterX = pieceRect.left + pieceRect.width / 2;
                const pieceCenterY = pieceRect.top + pieceRect.height / 2;
                
                if (pieceCenterX > puzzleRect.left && pieceCenterX < puzzleRect.right &&
                    pieceCenterY > puzzleRect.top && pieceCenterY < puzzleRect.bottom) {
                    
                    // Calcular la posición relativa dentro del puzzle
                    const relativeX = pieceCenterX - puzzleRect.left;
                    const relativeY = pieceCenterY - puzzleRect.top;
                    
                    const targetCol = Math.floor(relativeX / pieceWidth);
                    const targetRow = Math.floor(relativeY / pieceHeight);
                    
                    if (parseInt(piece.dataset.row) === targetRow && 
                        parseInt(piece.dataset.col) === targetCol &&
                        targetRow >= 0 && targetRow < GRID_SIZE && 
                        targetCol >= 0 && targetCol < GRID_SIZE) {
                        
                        // Colocar la pieza en su posición correcta
                        placePiece(piece, targetRow, targetCol);
                    } else {
                        // Volver a la posición inicial
                        resetPiecePosition(piece);
                    }
                } else {
                    // La pieza queda donde fue soltada
                    piece.style.zIndex = '2';
                }
                
                removeDragListeners();
            }
            
            function placePiece(piece, row, col) {
                puzzleContainer.appendChild(piece);
                piece.classList.add('placed');
                
                // Calcular posición absoluta dentro del puzzle
                const left = col * pieceWidth;
                const top = row * pieceHeight;
                
                piece.style.left = left + 'px';
                piece.style.top = top + 'px';
                piece.style.cursor = 'default';
                piece.style.zIndex = '1';
                
                placedPieces++;
                if (placedPieces === GRID_SIZE * GRID_SIZE) {
                    showSuccess();
                }
            }
            
            function resetPiecePosition(piece) {
                // Mantener la pieza en el área de juego pero no en su posición original
                const gameArea = document.querySelector('.game-area');
                positionPieceAround(piece);
                piece.style.zIndex = '2';
            }
            
            function removeDragListeners() {
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', endDrag);
                document.removeEventListener('touchend', endDrag);
            }
        }
        
        function showSuccess() {
            successMessage.style.display = 'block';
            successMessage.textContent = '¡Rompecabezas Completo!';
            
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 2000);
        }
        
        window.addEventListener('load', initGame);
        window.addEventListener('resize', function() {
            const oldWidth = boardWidth;
            const oldHeight = boardHeight;
            
            adjustBoardSize();
            
            if (oldWidth !== boardWidth || oldHeight !== boardHeight) {
                initGame();
            }
        });
    </script>
</body>
</html>
