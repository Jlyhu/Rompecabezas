<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rompecabezas Arrastrable</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }
        
        h1 {
            color: #2c3e50;
            margin: 20px 0;
            text-align: center;
        }
        
        .game-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        
        #puzzle-container {
            width: 500px;
            height: 650px; /* Proporción carta (8.5x11 pulgadas) */
            border: 3px solid #2c3e50;
            border-radius: 10px;
            background-color: #ecf0f1;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        #pieces-container {
            width: 500px;
            min-height: 400px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
            padding: 10px;
            border: 2px dashed #7f8c8d;
            border-radius: 10px;
            background-color: rgba(255,255,255,0.5);
        }
        
        .puzzle-piece {
            background-size: cover;
            position: relative;
            cursor: grab;
            transition: transform 0.1s;
            border: 2px solid #fff;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
        }
        
        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .puzzle-piece.placed {
            position: absolute;
            cursor: default;
            box-shadow: none;
        }
        
        #controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: 600;
        }
        
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        #difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        #difficulty-selector button {
            padding: 8px 15px;
            background-color: #95a5a6;
        }
        
        #difficulty-selector button.active {
            background-color: #27ae60;
        }
        
        #success-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @media (max-width: 900px) {
            .game-area {
                flex-direction: column;
                align-items: center;
            }
            
            #puzzle-container {
                width: 300px;
                height: 390px; /* Mantiene proporción carta */
            }
            
            #pieces-container {
                width: 300px;
            }
        }
    </style>
</head>
<body>
    <h1>Rompecabezas Arrastrable</h1>
    
    <div id="difficulty-selector">
        <button data-difficulty="2" class="active">Fácil (2×2)</button>
        <button data-difficulty="3">Medio (3×3)</button>
        <button data-difficulty="4">Difícil (4×4)</button>
        <button data-difficulty="6">Experto (6×6)</button>
    </div>
    
    <div class="game-area">
        <div id="puzzle-container"></div>
        <div id="pieces-container"></div>
    </div>
    
    <div id="controls">
        <button id="start-btn">Nuevo Juego</button>
    </div>
    
    <div id="success-message">¡Rompecabezas Completo!</div>
    
    <script>
        // Configuración del juego
        let GRID_SIZE = 2; // Valor inicial: Fácil
        const IMAGE_URL = 'puzzle.jpg'; // Nombre de tu imagen
        
        // Elementos del DOM
        const puzzleContainer = document.getElementById('puzzle-container');
        const piecesContainer = document.getElementById('pieces-container');
        const startBtn = document.getElementById('start-btn');
        const successMessage = document.getElementById('success-message');
        const difficultyButtons = document.querySelectorAll('#difficulty-selector button');
        
        // Variables del juego
        let pieces = [];
        let placedPieces = 0;
        let boardWidth = 500;
        let boardHeight = 650;
        let pieceWidth = 0;
        let pieceHeight = 0;
        let imgObj = null; // Para almacenar la imagen cargada
        
        // Inicializar el juego
        function initGame() {
            // Ajustar tamaño para móviles
            if (window.innerWidth <= 900) {
                boardWidth = 300;
                boardHeight = 390;
            } else {
                boardWidth = 500;
                boardHeight = 650;
            }
            
            puzzleContainer.style.width = boardWidth + 'px';
            puzzleContainer.style.height = boardHeight + 'px';
            piecesContainer.style.width = boardWidth + 'px';
            
            pieceWidth = boardWidth / GRID_SIZE;
            pieceHeight = boardHeight / GRID_SIZE;
            
            // Cargar la imagen
            loadImage();
            
            // Event listeners
            startBtn.addEventListener('click', initGame);
            
            // Configurar botones de dificultad
            difficultyButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Actualizar botón activo
                    difficultyButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Establecer dificultad
                    GRID_SIZE = parseInt(this.dataset.difficulty);
                    
                    // Reiniciar juego
                    initGame();
                });
            });
        }
        
        function loadImage() {
            if (imgObj) {
                // Si ya tenemos la imagen cargada, usarla directamente
                createPuzzlePieces(imgObj);
                return;
            }
            
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = IMAGE_URL;
            
            img.onload = function() {
                imgObj = img; // Guardar la imagen
                createPuzzlePieces(img);
            };
            
            img.onerror = function() {
                alert('Error al cargar la imagen. Asegúrate de que se llame "puzzle.jpg" y esté en la misma carpeta.');
            };
        }
        
        function createPuzzlePieces(img) {
            // Limpiar contenedores
            puzzleContainer.innerHTML = '';
            piecesContainer.innerHTML = '';
            pieces = [];
            placedPieces = 0;
            successMessage.style.display = 'none';
            
            // Crear canvas temporal para la imagen completa
            const fullCanvas = document.createElement('canvas');
            fullCanvas.width = boardWidth;
            fullCanvas.height = boardHeight;
            const fullCtx = fullCanvas.getContext('2d');
            
            // Dibujar imagen preservando la proporción
            const imgRatio = img.width / img.height;
            const containerRatio = boardWidth / boardHeight;
            
            let drawWidth, drawHeight, offsetX = 0, offsetY = 0;
            
            if (imgRatio > containerRatio) {
                // Imagen más ancha que el contenedor
                drawWidth = boardWidth;
                drawHeight = boardWidth / imgRatio;
                offsetY = (boardHeight - drawHeight) / 2;
            } else {
                // Imagen más alta que el contenedor
                drawHeight = boardHeight;
                drawWidth = boardHeight * imgRatio;
                offsetX = (boardWidth - drawWidth) / 2;
            }
            
            // Dibujar con suavizado para mejor calidad
            fullCtx.imageSmoothingEnabled = true;
            fullCtx.imageSmoothingQuality = 'high';
            fullCtx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
            
            // Crear piezas individuales
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    // Crear pieza
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece';
                    
                    // Tamaño de la pieza
                    piece.style.width = pieceWidth + 'px';
                    piece.style.height = pieceHeight + 'px';
                    
                    // Posición original
                    piece.dataset.row = row;
                    piece.dataset.col = col;
                    
                    // Crear canvas para la pieza individual
                    const pieceCanvas = document.createElement('canvas');
                    pieceCanvas.width = pieceWidth;
                    pieceCanvas.height = pieceHeight;
                    const pieceCtx = pieceCanvas.getContext('2d');
                    
                    // Activar suavizado para mejor calidad
                    pieceCtx.imageSmoothingEnabled = true;
                    pieceCtx.imageSmoothingQuality = 'high';
                    
                    // Extraer fragmento de la imagen
                    pieceCtx.drawImage(
                        fullCanvas,
                        col * pieceWidth, row * pieceHeight, pieceWidth, pieceHeight,
                        0, 0, pieceWidth, pieceHeight
                    );
                    
                    // Aplicar la imagen como fondo
                    piece.style.backgroundImage = `url(${pieceCanvas.toDataURL('image/jpeg', 1.0)})`;
                    
                    // Hacer arrastrable
                    makeDraggable(piece);
                    
                    // Agregar al contenedor de piezas
                    piecesContainer.appendChild(piece);
                    pieces.push(piece);
                }
            }
            
            // Mezclar piezas
            shufflePieces();
        }
        
        function makeDraggable(piece) {
            let offsetX, offsetY;
            let isDragging = false;
            
            piece.addEventListener('mousedown', startDrag);
            piece.addEventListener('touchstart', startDrag);
            
            function startDrag(e) {
                if (piece.classList.contains('placed')) return;
                
                isDragging = true;
                
                // Calcular offset
                const rect = piece.getBoundingClientRect();
                if (e.type === 'mousedown') {
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                } else {
                    offsetX = e.touches[0].clientX - rect.left;
                    offsetY = e.touches[0].clientY - rect.top;
                }
                
                // Estilo durante el arrastre
                piece.style.position = 'absolute';
                piece.style.zIndex = '100';
                piece.style.transform = 'scale(1.1)';
                
                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag);
                document.addEventListener('mouseup', endDrag);
                document.addEventListener('touchend', endDrag);
                
                e.preventDefault();
            }
            
            function drag(e) {
                if (!isDragging) return;
                
                const clientX = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
                const clientY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;
                
                piece.style.left = (clientX - offsetX) + 'px';
                piece.style.top = (clientY - offsetY) + 'px';
            }
            
            function endDrag(e) {
                if (!isDragging) return;
                isDragging = false;
                
                piece.style.transform = '';
                
                // Verificar si está sobre el puzzle container
                const puzzleRect = puzzleContainer.getBoundingClientRect();
                const pieceRect = piece.getBoundingClientRect();
                const pieceCenterX = pieceRect.left + pieceRect.width / 2;
                const pieceCenterY = pieceRect.top + pieceRect.height / 2;
                
                if (pieceCenterX > puzzleRect.left && pieceCenterX < puzzleRect.right &&
                    pieceCenterY > puzzleRect.top && pieceCenterY < puzzleRect.bottom) {
                    
                    // Calcular posición correcta
                    const targetCol = Math.floor((pieceCenterX - puzzleRect.left) / pieceWidth);
                    const targetRow = Math.floor((pieceCenterY - puzzleRect.top) / pieceHeight);
                    
                    // Verificar si es la posición correcta y está dentro de los límites
                    if (parseInt(piece.dataset.row) === targetRow && 
                        parseInt(piece.dataset.col) === targetCol &&
                        targetRow >= 0 && targetRow < GRID_SIZE &&
                        targetCol >= 0 && targetCol < GRID_SIZE) {
                        
                        // Colocar en la posición correcta
                        puzzleContainer.appendChild(piece);
                        piece.classList.add('placed');
                        piece.style.left = (targetCol * pieceWidth) + 'px';
                        piece.style.top = (targetRow * pieceHeight) + 'px';
                        piece.style.cursor = 'default';
                        
                        // Verificar si el puzzle está completo
                        placedPieces++;
                        if (placedPieces === GRID_SIZE * GRID_SIZE) {
                            showSuccess();
                        }
                    } else {
                        // Volver al contenedor de piezas
                        piecesContainer.appendChild(piece);
                        piece.style.position = 'relative';
                        piece.style.left = '';
                        piece.style.top = '';
                    }
                } else {
                    // Volver al contenedor de piezas
                    piecesContainer.appendChild(piece);
                    piece.style.position = 'relative';
                    piece.style.left = '';
                    piece.style.top = '';
                }
                
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', endDrag);
                document.removeEventListener('touchend', endDrag);
            }
        }
        
        function shufflePieces() {
            // Mezclar el orden de las piezas
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                piecesContainer.appendChild(pieces[j]);
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }
        }
        
        function showSuccess() {
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 2000);
        }
        
        // Iniciar el juego
        window.addEventListener('load', initGame);
        window.addEventListener('resize', function() {
            if ((window.innerWidth <= 900 && boardWidth !== 300) || 
                (window.innerWidth > 900 && boardWidth !== 500)) {
                initGame();
            }
        });
    </script>
</body>
</html>
